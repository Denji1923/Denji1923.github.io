# Render Blueprint: pushes of this repo build the Dockerfile and publish the site.
services:
  - type: web
    name: campus-lost-found
    runtime: docker
    plan: starter            # a persistent disk (for uploaded pictures) needs a paid plan
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_URL          # e.g. jdbc:mysql://HOST:PORT/campus_lost_found?sslMode=REQUIRED&serverTimezone=UTC
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD  # password of the first admin account (user: admin)
        sync: false
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1
